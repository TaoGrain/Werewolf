[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "werewolf-agents"
version = "0.1.0"
description = "多 Agent 狼人杀本地 MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "pymysql>=1.1,<2",
  "httpx>=0.28,<1",
  "socksio>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "aiosqlite>=0.21,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
